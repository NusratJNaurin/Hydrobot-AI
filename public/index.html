<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hydrobot.Ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar" aria-label="Main navigation">
  <a class="brand" href="#dashboard" aria-label="Hydrobot.Ai home">
    <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg></span>
    <span class="brand-name">Hydrobot<span>.Ai</span></span>
  </a>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot" id="sideFoot"></div>
</aside>

<div class="main">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open navigation menu" aria-controls="sidebar" aria-expanded="false"></button>
    <a class="brand mobile-brand" href="#dashboard" aria-label="Hydrobot.Ai home">
      <span class="brand-mark"><svg class="ico" viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg></span>
      <span class="brand-name">Hydrobot<span>.Ai</span></span>
    </a>
    <div class="search desktop-search" role="search">
      <label for="gsearch" class="sr">Search farm records</label>
      <input id="gsearch" type="search" placeholder="Search batches, tasks, inventory, orders…" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gresults" aria-autocomplete="list">
      <div class="search-results" id="gresults" role="listbox" aria-label="Search results" hidden></div>
    </div>
    <div class="top-actions desktop-actions">
      <label for="farmSel" class="sr">Select farm</label>
      <select id="farmSel" class="select">
        <option value="riverside">Riverside Hydro Farm</option>
        <option value="hilltop">Hilltop Annex</option>
      </select>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme"></button>
      <div class="pop-wrap">
        <button class="icon-btn" id="bellBtn" aria-label="Notifications" aria-haspopup="true" aria-expanded="false"></button>
        <div class="popover" id="bellPop" hidden></div>
      </div>
      <div class="pop-wrap">
        <button class="profile-btn" id="profileBtn" aria-haspopup="true" aria-expanded="false" aria-label="User profile and role"></button>
        <div class="popover" id="profilePop" hidden></div>
      </div>
    </div>
    <div class="pop-wrap mobile-util-wrap">
      <button class="icon-btn" id="mobileUtilBtn" aria-label="Quick utilities and actions menu" aria-haspopup="true" aria-expanded="false"></button>
      <div class="popover mobile-util-pop" id="mobileUtilPop" hidden></div>
    </div>
  </header>
  <main class="content" id="view" tabindex="-1"></main>
</div>

<dialog id="modal" aria-labelledby="modalTitle"></dialog>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
